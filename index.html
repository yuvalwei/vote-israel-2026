            </article>
          );
        })}

    </div>
  );
}

function BlocPieChart({ poll }) {
  const data = BLOCS.map((b) => ({
    name: b.label,
    value: b.parties.reduce((sum, pid) => sum + (poll.seats[pid] || 0), 0),
    color: b.color,
  })).filter((d) => d.value > 0);
  const coalitionSeats = BLOCS[0].parties.reduce((sum, pid) => sum + (poll.seats[pid] || 0), 0);

  const size = 210;
  const strokeWidth = 32;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const total = data.reduce((s, d) => s + d.value, 0);
  const gapPx = total ? 4 : 0;
  let cumulative = 0;

  return (
    <div style={{ marginBottom: "20px" }}>
      <div style={{ fontSize: "12px", fontWeight: 700, letterSpacing: "0.05em", color: "#6B7280", marginBottom: "8px" }}>מפת גושים</div>
      <div style={{ position: "relative", height: `${size}px`, display: "flex", justifyContent: "center" }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
            {data.map((d, i) => {
              const frac = total ? d.value / total : 0;
              const len = Math.max(circumference * frac - gapPx, 0);
              const dashoffset = -cumulative;
              cumulative += circumference * frac;
              return (
                <circle key={i} cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={d.color}
                  strokeWidth={strokeWidth} strokeDasharray={`${len} ${circumference - len}`}
                  strokeDashoffset={dashoffset} strokeLinecap="round" />
              );
            })}
          </g>
        </svg>
        <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", textAlign: "center", pointerEvents: "none" }}>
          <div style={{ fontSize: "24px", fontWeight: 900, fontFamily: "'Rubik', sans-serif", color: "#181433" }}>{coalitionSeats}</div>
          <div style={{ fontSize: "10.5px", color: "#9CA3C4" }}>קואליציה מתוך 61</div>
        </div>
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: "14px", marginTop: "10px" }}>
        {data.map((d, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: "5px", fontSize: "12px", color: "#3C3860" }}>
            <span style={{ width: "10px", height: "10px", borderRadius: "50%", background: d.color, display: "inline-block" }} />
            {d.name} ({d.value})
          </div>
        ))}
      </div>
      <p style={{ fontSize: "11px", color: "#9CA3C4", marginTop: "6px", lineHeight: 1.6, textAlign: "center" }}>"אופוזיציה" כולל גם את ישר וישראל ביתנו — שטרם הכריעו סופית לאיזה צד הן נוטות (פירוט בטאב "עמדות").</p>
    </div>
  );
}

  const rows = PARTIES.map((p) => ({ ...p, seats: poll.seats[p.id] || 0 })).sort((a, b) => b.seats - a.seats);

      <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>

      <p style={{ fontSize: "12.5px", color: "#6B7280", marginTop: "16px", lineHeight: 1.7 }}>מספר המנדטים לכנסת: 120. אחוז החסימה: 3.25%. שימו לב לפער בין ערוץ 14 לבין ערוצי 12 ו-13 — לכן אנו מציגים את שלושתם זה לצד זה במקום ממוצע יחיד.</p>
    </div>
  );
}

function CoalitionBuilderTab() {
  const [pollId, setPollId] = useState("c12");
  const [selected, setSelected] = useState(() => new Set());
  const poll = POLLS.find((p) => p.id === pollId);
  const rows = PARTIES.map((p) => ({ ...p, seats: poll.seats[p.id] || 0 })).filter((p) => p.seats > 0).sort((a, b) => b.seats - a.seats);
  const total = [...selected].reduce((sum, pid) => sum + (poll.seats[pid] || 0), 0);
  const pct = Math.min(100, (total / MAJORITY) * 100);
  const hasMajority = total >= MAJORITY;

  const toggle = (id) => setSelected((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const reset = () => setSelected(new Set());

  return (
    <div>
      <p style={{ fontSize: "13.5px", color: "#3C3860", lineHeight: 1.7, marginBottom: "16px" }}>בחרו מפלגות ובנו קואליציה היפותטית לפי מנדטים מהסקר שתבחרו. יעד: 61 מנדטים.</p>
      <div style={{ display: "flex", gap: "8px", marginBottom: "16px", overflowX: "auto" }}>
        {POLLS.map((p) => <button key={p.id} onClick={() => setPollId(p.id)} style={{ flex: "0 0 auto", border: pollId === p.id ? "1.5px solid #181433" : "1.5px solid #E3E4F5", background: pollId === p.id ? "#181433" : "#FFFFFF", color: pollId === p.id ? "#FAFAFF" : "#181433", borderRadius: "999px", padding: "8px 14px", fontSize: "13px", fontFamily: "'Heebo', sans-serif", cursor: "pointer", whiteSpace: "nowrap" }}>{p.label}</button>)}
      </div>

      <div style={{ background: "#FFFFFF", border: "1px solid #ECEAFB", borderRadius: "10px", padding: "16px", marginBottom: "18px", position: "sticky", top: "8px", zIndex: 5 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: "8px" }}>
          <span style={{ fontSize: "13px", color: "#6B7280" }}>סה"כ מנדטים נבחרים</span>
          <span style={{ fontSize: "22px", fontWeight: 900, fontFamily: "'Rubik', sans-serif", color: hasMajority ? "#1C8C8C" : "#181433" }}>{total} / 61</span>
        </div>
        <div style={{ background: "#EEEDFA", borderRadius: "999px", height: "14px", overflow: "hidden", position: "relative" }}>
          <div style={{ width: `${pct}%`, background: hasMajority ? "#1C8C8C" : "#1857C4", height: "100%", transition: "width .3s ease" }} />
        </div>
        <p style={{ margin: "8px 0 0", fontSize: "13px", fontWeight: 700, color: hasMajority ? "#1C8C8C" : "#B3204A" }}>
          {hasMajority ? `יש רוב! עודף של ${total - MAJORITY} מנדטים.` : `חסרים עוד ${MAJORITY - total} מנדטים לרוב.`}
        </p>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
        {rows.map((p) => {
          const on = selected.has(p.id);
          return (
            <button key={p.id} onClick={() => toggle(p.id)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", textAlign: "right", border: `1.5px solid ${on ? p.color : "#ECEAFB"}`, background: on ? `${p.color}14` : "#FFFFFF", borderRadius: "8px", padding: "12px 14px", cursor: "pointer", fontFamily: "'Heebo', sans-serif" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <span style={{ width: "18px", height: "18px", borderRadius: "5px", border: `1.5px solid ${p.color}`, background: on ? p.color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: "12px", flexShrink: 0 }}>{on ? "✓" : ""}</span>
                <span style={{ fontSize: "14.5px", fontWeight: 500, color: "#181433" }}>{p.name}</span>
              </div>
              <span style={{ fontSize: "14px", fontWeight: 700, color: p.color }}>{p.seats}</span>
            </button>
          );
        })}
      </div>
      <button onClick={reset} style={{ width: "100%", marginTop: "16px", padding: "12px", background: "#FFFFFF", border: "1.5px solid #ECEAFB", color: "#6B7280", borderRadius: "8px", fontSize: "13.5px", fontFamily: "'Heebo', sans-serif", cursor: "pointer" }}>אפס בחירה</button>
    </div>
  );
}

function PersonalCompareTab() {
  const [pair, setPair] = useState([]);
  const [topicIndex, setTopicIndex] = useState(0);
  const [dragX, setDragX] = useState(0);
  const draggingRef = useRef(false);
  const startXRef = useRef(0);

  const togglePair = (id) => setPair((prev) => {
    if (prev.includes(id)) return prev.filter((x) => x !== id);
    if (prev.length >= 2) return [prev[1], id];
    return [...prev, id];
  });

  const partyA = PARTIES.find((p) => p.id === pair[0]);
  const partyB = PARTIES.find((p) => p.id === pair[1]);
  const ready = partyA && partyB;

  const goNext = () => setTopicIndex((i) => Math.min(TOPICS.length - 1, i + 1));
  const goPrev = () => setTopicIndex((i) => Math.max(0, i - 1));

  const onDragStart = (clientX) => { draggingRef.current = true; startXRef.current = clientX; };
  const onDragMove = (clientX) => { if (draggingRef.current) setDragX(clientX - startXRef.current); };
  const onDragEnd = () => {
    if (!draggingRef.current) return;
    draggingRef.current = false;
    if (dragX < -70) goNext();
    else if (dragX > 70) goPrev();
    setDragX(0);
  };

  if (!ready) {
    return (
      <div>
        <p style={{ fontSize: "13.5px", color: "#3C3860", lineHeight: 1.7, marginBottom: "6px" }}>ראש בראש: בחרו בדיוק שתי מפלגות להשוואה.</p>
        <p style={{ fontSize: "12.5px", color: "#9CA3C4", lineHeight: 1.6, marginBottom: "16px" }}>{pair.length === 0 ? "עוד לא נבחרה אף מפלגה." : `נבחרה מפלגה אחת (${PARTIES.find(p => p.id === pair[0])?.name}) — בחרו עוד אחת.`}</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
          {PARTIES.map((p) => {
            const on = pair.includes(p.id);
            return (
              <button key={p.id} onClick={() => togglePair(p.id)} style={{ display: "flex", alignItems: "center", gap: "6px", border: `1.5px solid ${on ? p.color : "#E3E4F5"}`, background: on ? `${p.color}14` : "#FFFFFF", borderRadius: "8px", padding: "8px 12px", fontSize: "13.5px", color: "#181433", fontFamily: "'Heebo', sans-serif", cursor: "pointer" }}>
                <span style={{ width: "9px", height: "9px", borderRadius: "50%", background: p.color, display: "inline-block", flexShrink: 0 }} />{p.name}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  const topic = TOPICS[topicIndex];
  const rotate = dragX / 18;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "14px" }}>
        <button onClick={() => { setPair([]); setTopicIndex(0); }} style={{ background: "none", border: "none", color: "#1857C4", fontSize: "12.5px", cursor: "pointer", padding: 0 }}>↺ בחרו זוג אחר</button>
        <span style={{ fontSize: "12.5px", color: "#6B7280", fontWeight: 700 }}>{topicIndex + 1} / {TOPICS.length}</span>
      </div>

      <div
        style={{ position: "relative", height: "320px", touchAction: "pan-y", userSelect: "none" }}
        onTouchStart={(e) => onDragStart(e.touches[0].clientX)}
        onTouchMove={(e) => onDragMove(e.touches[0].clientX)}
        onTouchEnd={onDragEnd}
        onMouseDown={(e) => onDragStart(e.clientX)}
        onMouseMove={(e) => onDragMove(e.clientX)}
        onMouseUp={onDragEnd}
        onMouseLeave={onDragEnd}
      >
        <div style={{ position: "absolute", inset: 0, transform: `translateX(${dragX}px) rotate(${rotate}deg)`, transition: draggingRef.current ? "none" : "transform .25s ease", cursor: "grab" }}>
          <HeadToHeadCard topic={topic} partyA={partyA} partyB={partyB} />
        </div>
        {dragX < -30 && <div style={{ position: "absolute", left: "12px", top: "12px", background: "#1857C4", color: "#fff", fontSize: "11px", fontWeight: 700, borderRadius: "999px", padding: "4px 10px" }}>הבא ←</div>}
        {dragX > 30 && <div style={{ position: "absolute", right: "12px", top: "12px", background: "#1857C4", color: "#fff", fontSize: "11px", fontWeight: 700, borderRadius: "999px", padding: "4px 10px" }}>→ הקודם</div>}
      </div>

      <div style={{ display: "flex", justifyContent: "center", gap: "6px", margin: "14px 0" }}>
        {TOPICS.map((t, i) => <span key={t.id} style={{ width: i === topicIndex ? "16px" : "6px", height: "6px", borderRadius: "999px", background: i === topicIndex ? "#1857C4" : "#E3E4F5", transition: "all .2s ease" }} />)}
      </div>

      <div style={{ display: "flex", gap: "10px" }}>
        <button onClick={goPrev} disabled={topicIndex === 0} style={{ flex: 1, padding: "12px", background: "#FFFFFF", border: "1.5px solid #ECEAFB", color: topicIndex === 0 ? "#C7CADB" : "#181433", borderRadius: "8px", fontSize: "14px", fontFamily: "'Heebo', sans-serif", cursor: topicIndex === 0 ? "not-allowed" : "pointer" }}>→ הקודם</button>
        <button onClick={goNext} disabled={topicIndex === TOPICS.length - 1} style={{ flex: 1, padding: "12px", background: "#181433", border: "none", color: topicIndex === TOPICS.length - 1 ? "#8A8FB8" : "#FAFAFF", borderRadius: "8px", fontSize: "14px", fontFamily: "'Heebo', sans-serif", cursor: topicIndex === TOPICS.length - 1 ? "not-allowed" : "pointer" }}>הבא ←</button>
      </div>
      <p style={{ fontSize: "11.5px", color: "#9CA3C4", marginTop: "10px", textAlign: "center" }}>גררו את הכרטיס ימינה או שמאלה, או השתמשו בכפתורים.</p>
    </div>

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function decodeKalpiLoc(loc) {
  const [sIdx, address, venue, lat, lng, nKalpiyot, accessible, specialAccessible] = loc;
  return { settlement: KALPI_DATA.settlements[sIdx], address, venue, lat, lng, nKalpiyot, accessible, specialAccessible };
}

function AccessBadge({ accessible, specialAccessible, total }) {
  if (accessible === 0 && specialAccessible === 0) {
    return <span style={{ fontSize: "11px", background: "#FFF0F3", color: "#B3204A", borderRadius: "5px", padding: "3px 8px", fontWeight: 700 }}>לא נגיש</span>;
  }
  return (
    <span style={{ display: "flex", gap: "5px", flexWrap: "wrap" }}>
      {accessible > 0 && <span style={{ fontSize: "11px", background: "#EAF7EF", color: "#1C7A4A", borderRadius: "5px", padding: "3px 8px", fontWeight: 700 }}>♿ נגישה ({accessible}/{total})</span>}
      {specialAccessible > 0 && <span style={{ fontSize: "11px", background: "#EAF7EF", color: "#1C7A4A", borderRadius: "5px", padding: "3px 8px", fontWeight: 700 }}>נגישות מיוחדת ({specialAccessible})</span>}
    </span>
  );
}

function useLeaflet() {
  const [ready, setReady] = useState(!!(typeof window !== "undefined" && window.L));
  useEffect(() => {
    if (typeof window === "undefined") return;
    if (window.L) { setReady(true); return; }
    if (!document.querySelector('link[data-leaflet-css]')) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
      link.setAttribute("data-leaflet-css", "1");
      document.head.appendChild(link);
    }
    if (!document.querySelector('script[data-leaflet-js]')) {
      const script = document.createElement("script");
      script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
      script.setAttribute("data-leaflet-js", "1");
      script.onload = () => setReady(true);
      document.body.appendChild(script);
    } else {
      const check = setInterval(() => { if (window.L) { setReady(true); clearInterval(check); } }, 200);
      return () => clearInterval(check);
    }
  }, []);
  return ready;
}

function KalpiMultiMap({ userLoc, results, activeIdx, onSelectIdx }) {
  const mapElRef = useRef(null);
  const mapObjRef = useRef(null);
  const layerRef = useRef(null);
  const leafletReady = useLeaflet();

  useEffect(() => {
    if (!leafletReady || !mapElRef.current) return;
    if (!mapObjRef.current) {
      mapObjRef.current = window.L.map(mapElRef.current, { attributionControl: true });
      window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(mapObjRef.current);
      layerRef.current = window.L.layerGroup().addTo(mapObjRef.current);
    }
    const map = mapObjRef.current;
    layerRef.current.clearLayers();
    const bounds = [];

    if (userLoc) {
      const um = window.L.circleMarker([userLoc.lat, userLoc.lng], { radius: 8, color: "#1857C4", weight: 3, fillColor: "#4C93FF", fillOpacity: 1 });
      um.bindPopup("המיקום שלכם");
      layerRef.current.addLayer(um);
      bounds.push([userLoc.lat, userLoc.lng]);
    }

    results.forEach((r, i) => {
      const isActive = i === activeIdx;
      const icon = window.L.divIcon({
        className: "",
        html: `<div style="background:${isActive ? "#1857C4" : "#B23A48"};color:#fff;border-radius:50% 50% 50% 0;width:28px;height:28px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)"><span style="transform:rotate(45deg);font-size:12px;font-weight:700">${i + 1}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
      });
      const m = window.L.marker([r.loc.lat, r.loc.lng], { icon });
      const safeVenue = String(r.loc.venue).replace(/</g, "&lt;");
      const safeAddr = String(r.loc.address).replace(/</g, "&lt;");
      m.bindPopup(`<b>${safeVenue}</b><br>${safeAddr}<br><a href="https://www.google.com/maps/dir/?api=1&destination=${r.loc.lat},${r.loc.lng}" target="_blank" rel="noopener noreferrer">נווטו בגוגל מפות ←</a>`);
      m.on("click", () => onSelectIdx(i));
      layerRef.current.addLayer(m);
      bounds.push([r.loc.lat, r.loc.lng]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 15);
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [28, 28], maxZoom: 16 });
    } else {
      map.setView([31.5, 34.9], 7);
    }
    setTimeout(() => map.invalidateSize(), 50);
  }, [leafletReady, userLoc, results, activeIdx]);

  if (!leafletReady) {
    return <div style={{ height: "260px", display: "flex", alignItems: "center", justifyContent: "center", color: "#9CA3C4", fontSize: "13px", background: "#F0F0F7", borderRadius: "10px" }}>טוען מפה...</div>;
  }
  return <div ref={mapElRef} style={{ height: "260px", borderRadius: "10px", overflow: "hidden", border: "1px solid #ECEAFB" }} />;
}

function PollingStationTab({ userLoc, setUserLoc, locStatus, locErrorMsg, requestLocation }) {
  const [query, setQuery] = useState("");
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [geocodeStatus, setGeocodeStatus] = useState("idle"); // idle | loading | notfound

  const nearest = useMemo(() => {
    if (!userLoc) return [];
    return KALPI_DATA.locations
      .map(decodeKalpiLoc)
      .map((loc) => ({ loc, dist: haversineKm(userLoc.lat, userLoc.lng, loc.lat, loc.lng) }))
      .sort((a, b) => a.dist - b.dist)
      .slice(0, 8);
  }, [userLoc]);

  const settlementResults = useMemo(() => {
    const q = query.trim();
    if (q.length < 2) return [];
    const matchIdxs = new Set(KALPI_DATA.settlements.map((name, i) => (name.includes(q) ? i : -1)).filter((i) => i >= 0));
    return KALPI_DATA.locations
      .filter((loc) => matchIdxs.has(loc[0]))
      .map(decodeKalpiLoc)
      .map((loc) => ({ loc, dist: null }))
      .slice(0, 25);
  }, [query]);

  const results = userLoc ? nearest : settlementResults;

  useEffect(() => { setSelectedIdx(0); }, [userLoc, query]);

  const handleSearch = async () => {
    const q = query.trim();
    if (!q) return;
    setGeocodeStatus("loading");
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=il&limit=1`);
      const data = await res.json();
      if (data && data.length > 0) {
        setUserLoc({ lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) });
        setGeocodeStatus("idle");
        return;
      }
      setGeocodeStatus("notfound");
    } catch (e) {
      setGeocodeStatus("notfound");
    }
  };

  const activeResult = results[selectedIdx] || results[0];

  return (
    <div>
      <p style={{ fontSize: "13.5px", color: "#3C3860", lineHeight: 1.7, marginBottom: "14px" }}>
        מצאו את מקום הקלפי הקרוב לכם, כולל מידע נגישות. הנתונים מבוססים על קובץ ריכוזי הקלפיות הרשמי (עודכן לאחר סגירת רשימות המפלגות, 8.9.2026).
      </p>

      {locStatus === "error" && (
        <div style={{ fontSize: "12.5px", color: "#B3204A", background: "#FFF0F3", borderRadius: "6px", padding: "10px 12px", marginBottom: "14px", lineHeight: 1.6 }}>{locErrorMsg}</div>
      )}

      <div style={{ display: "flex", gap: "8px", marginBottom: "6px" }}>
        <input
          type="text"
          value={query}
          onChange={(e) => { setQuery(e.target.value); setGeocodeStatus("idle"); }}
          onKeyDown={(e) => { if (e.key === "Enter") handleSearch(); }}
          placeholder="הקלידו כתובת מלאה או שם יישוב..."
          style={{ flex: 1, padding: "11px 14px", borderRadius: "8px", border: "1px solid #ECEAFB", fontSize: "14px", fontFamily: "'Heebo', sans-serif", background: "#FFFFFF" }}
        />
        <button onClick={handleSearch} disabled={geocodeStatus === "loading"} style={{ padding: "0 18px", borderRadius: "8px", border: "none", background: "#181433", color: "#fff", fontSize: "13.5px", fontWeight: 700, fontFamily: "'Heebo', sans-serif", cursor: "pointer" }}>
          {geocodeStatus === "loading" ? "..." : "חפשו"}
        </button>
      </div>
      {geocodeStatus === "notfound" && (
        <p style={{ fontSize: "12px", color: "#9CA3C4", marginBottom: "10px" }}>לא זוהתה כתובת מדויקת — מציגים תוצאות לפי התאמת שם יישוב במקום.</p>
      )}
      <p style={{ fontSize: "11.5px", color: "#9CA3C4", marginBottom: "16px" }}>
        אפשר להקליד כתובת מלאה (לדוגמה "דיזנגוף 50 תל אביב") לחישוב מרחק מדויק, או רק שם יישוב.
      </p>

      {results.length === 0 && userLoc === null && query.trim().length < 2 && (
        <div style={{ textAlign: "center", padding: "30px 0", color: "#9CA3C4", fontSize: "13.5px" }}>הקלידו כתובת או שם יישוב, או השתמשו בכפתור "מצא את הקלפי שלי" למעלה.</div>
      )}
      {results.length === 0 && (userLoc !== null || query.trim().length >= 2) && geocodeStatus !== "loading" && (
        <div style={{ textAlign: "center", padding: "30px 0", color: "#9CA3C4", fontSize: "13.5px" }}>לא נמצאו תוצאות. נסו כתובת או יישוב אחר.</div>
      )}

      {results.length > 0 && (
        <div style={{ marginBottom: "14px" }}>
          <KalpiMultiMap userLoc={userLoc} results={results} activeIdx={selectedIdx} onSelectIdx={setSelectedIdx} />
          {activeResult && (
            <a
              href={`https://www.google.com/maps/dir/?api=1&destination=${activeResult.loc.lat},${activeResult.loc.lng}`}
              target="_blank"
              rel="noopener noreferrer"
              style={{ display: "block", textAlign: "center", padding: "10px", marginTop: "8px", background: "#181433", color: "#FAFAFF", fontSize: "13.5px", fontWeight: 700, textDecoration: "none", fontFamily: "'Heebo', sans-serif", borderRadius: "8px" }}
            >
              נווטו ל־{activeResult.loc.venue} בגוגל מפות ←
            </a>
          )}
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
        {results.map((r, i) => (
          <KalpiCard key={i} loc={r.loc} dist={r.dist} active={i === selectedIdx} index={i} onClick={() => setSelectedIdx(i)} />
        ))}
      </div>

      <p style={{ fontSize: "11.5px", color: "#9CA3C4", marginTop: "16px", lineHeight: 1.6 }}>
        "נגישה" = יש בקלפי הזו לפחות עמדת הצבעה נגישה לנכים. "נגישות מיוחדת" = התאמות נוספות (למשל לכבדי ראייה). המספר בסוגריים מציג כמה מתוך הקלפיות במקום הזה נגישות. חיפוש הכתובת מתבצע דרך שירות חיצוני (OpenStreetMap Nominatim); מיקום הקלפי הסופי שלכם נקבע לפי כתובת המגורים הרשומה בפנקס הבוחרים — ייתכנו עדכונים סופיים קרוב יותר ליום הבחירות.
      </p>
    </div>
  );
}

// הסבר קצר לפני כל מקטע בשאלון — לחבר את מי שעונה למצב הקיים, לפני שהוא בוחר תשובה.
const CATEGORY_INTRO = {
  "ביטחון": "מאז 7 באוקטובר 2023 ישראל בעימות מתמשך, ושאלות הביטחון והגיוס נמצאות בליבת השיח הציבורי. השאלות הבאות עוסקות בגיוס חרדים, ביחס למדינה פלסטינית ולהתנחלויות, ובאחריות לכשלי 7 באוקטובר.",
  "כלכלה": "יוקר המחיה נשאר גבוה, ותקציב המלחמה יצר מתח בין הוצאות ביטחוניות להוצאות אזרחיות. השאלות הבאות בודקות עד כמה אתם רוצים שהמדינה תתערב בשוק כדי להקל על משקי הבית.",
  "דת ומדינה": "היחסים בין דת למדינה מבוססים על הסדר ותיק שכמעט לא השתנה, בזמן שהחברה הישראלית מגוונת יותר מבחינה דתית מתמיד. השאלות הבאות בודקות עד כמה אתם רוצים לשנות את האיזון הזה.",
  "משילות": 'מ-2023 מתנהל מאבק על מאזן הכוחות בין הממשלה, הכנסת ובג"ץ, וטרם קמה ועדת חקירה ממלכתית ל-7 באוקטובר. השאלות הבאות בודקות איזה איזון אתם רוצים בין שלטון נבחר לביקורת שיפוטית.',
  "חברה וזהות": "כ-20% מאזרחי ישראל הם ערבים, ומאז 7 באוקטובר רוב המפלגות היהודיות שוללות שיתוף פעולה קואליציוני עם מפלגות ערביות. השאלות הבאות עוסקות ביחסי יהודים-ערבים ובזהות המדינה.",
};
const CATEGORY_ORDER = ["ביטחון", "כלכלה", "דת ומדינה", "משילות", "חברה וזהות"];
const SECURITY_IDENTITY_CATS = ["ביטחון", "חברה וזהות"];
const SECURITY_MATCH_THRESHOLD = 40;

// עובדה שהשאלון לא שואל עליה ישירות: ציונות. זה קו הרבה יותר יסודי מכל שאלת מדיניות בודדת,
// ורלוונטי בעיקר לגבי חד"ש ובל"ד — לא רע"ם, שהיא מפלגה איסלאמיסטית פרגמטית שפועלת בתוך
// המסגרת הציונית (ולכן הצטרפה לקואליציה ב-2021, תקדים שלא קרה לחד"ש או בל"ד).
const ZIONISM_NOTE = {
  hadash: 'חד"ש מגדירה את עצמה כרשימה יהודית-ערבית ולא כמפלגה ציונית — שורשיה במפלגה הקומוניסטית הישראלית (מק"י), שמעולם לא הזדהתה כציונית.',
  balad: 'בל"ד מוגדרת (כולל בוויקיפדיה) כמפלגה אנטי-ציונית באופן מפורש — מצעה קורא ל"מדינת כל אזרחיה" במקום מדינת לאום יהודית.',
};

function QuizTab({ onViewTopMatches }) {
  const [answers, setAnswers] = useState({});
  const [showResults, setShowResults] = useState(false);
  const answeredCount = Object.keys(answers).length;
  const setAnswer = (qid, v) => setAnswers((prev) => ({ ...prev, [qid]: v }));
  // ציר הביטחון/זהות הוא הציר שקובע בפועל את ההצבעה בישראל הרבה יותר מנושאים חתכי-רוחב
  // כמו רפורמה משפטית או כלכלה — בלעדי המשקל הזה, הסכמה על נושאי משילות/כלכלה בלבד
  // (בלי שום קרבה לציר הלאומי) הייתה יכולה להעלות מפלגות באופן לא ריאלי.
  const questionWeight = (cat) => (cat === "ביטחון" || cat === "חברה וזהות") ? 2 : 1;
  const results = useMemo(() => {
    const scores = {};
    const secScores = {};
    PARTIES.forEach((p) => { scores[p.id] = 0; secScores[p.id] = 0; });
    let maxPossible = 0;
    let secMaxPossible = 0;
    QUESTIONS.forEach((q) => {
      const a = answers[q.id];
      if (a === undefined) return;
      const w = questionWeight(q.cat);
      maxPossible += 4 * w;
      const isSecurity = SECURITY_IDENTITY_CATS.includes(q.cat);
      if (isSecurity) secMaxPossible += 4;
      PARTIES.forEach((p) => {
        const contribution = a * (q.stance[p.id] || 0);
        scores[p.id] += w * contribution;
        if (isSecurity) secScores[p.id] += contribution;
      });
    });
    return PARTIES.map((p) => ({
      ...p,
      score: scores[p.id],
      pct: maxPossible ? Math.round(((scores[p.id] + maxPossible) / (2 * maxPossible)) * 100) : 0,
      secPct: secMaxPossible ? Math.round(((secScores[p.id] + secMaxPossible) / (2 * secMaxPossible)) * 100) : null,
    })).sort((a, b) => b.score - a.score);
  }, [answers]);
  const reset = () => { setAnswers({}); setShowResults(false); };

  if (showResults) {
    const top = results.slice(0, 5);
    return (
      <div>
        <h3 style={{ fontFamily: "'Rubik', sans-serif", fontSize: "20px", margin: "0 0 6px" }}>ההתאמות שלך</h3>
        <p style={{ fontSize: "13px", color: "#6B7280", marginBottom: "16px", lineHeight: 1.6 }}>מבוסס על {answeredCount} תשובות מתוך {QUESTIONS.length}.</p>
        <div style={{ display: "flex", flexDirection: "column", gap: "10px", marginBottom: "20px" }}>
          {top.map((p, i) => {
            const flagged = p.secPct !== null && p.secPct < SECURITY_MATCH_THRESHOLD;
            return (
              <div key={p.id} style={{ background: "#FFFFFF", border: "1px solid #ECEAFB", borderRight: `5px solid ${p.color}`, borderRadius: "6px", padding: "12px 16px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                    <span style={{ fontFamily: "'Rubik', sans-serif", fontWeight: 900, fontSize: "15px", color: "#9CA3C4" }}>{i + 1}</span>
                    <span style={{ fontFamily: "'Rubik', sans-serif", fontWeight: 700, fontSize: "16.5px" }}>{p.name}</span>
                  </div>
                  <span style={{ fontSize: "14px", fontWeight: 700, color: p.color }}>{p.pct}%</span>
                </div>
                <div style={{ background: "#EEEDFA", borderRadius: "4px", height: "8px", marginTop: "8px", overflow: "hidden" }}><div style={{ width: `${p.pct}%`, background: p.color, height: "100%" }} /></div>
                {flagged && (
                  <div style={{ marginTop: "8px", fontSize: "11.5px", color: "#B3204A", background: "#FFF0F3", borderRadius: "5px", padding: "6px 9px", lineHeight: 1.5 }}>
                    ⚠️ פער משמעותי בעמדות ביטחון וזהות ({p.secPct}% התאמה בציר הזה בלבד) — ההתאמה הכללית גבוהה, אבל בנושאים האלה אתם רחוקים.
                  </div>
                )}
                {ZIONISM_NOTE[p.id] && (
                  <div style={{ marginTop: "8px", fontSize: "11.5px", color: "#1857C4", background: "#F0F3FF", borderRadius: "5px", padding: "6px 9px", lineHeight: 1.5 }}>
                    ℹ️ {ZIONISM_NOTE[p.id]} השאלון לא שאל על כך ישירות.
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <button onClick={() => onViewTopMatches(top.slice(0, 3).map((p) => p.id))} style={{ width: "100%", padding: "13px", background: "#1857C4", color: "#fff", border: "none", borderRadius: "6px", fontSize: "14.5px", fontWeight: 700, fontFamily: "'Heebo', sans-serif", cursor: "pointer", marginBottom: "10px" }}>
          ראו את העמדות המלאות של 3 ההתאמות הכי גבוהות שלכם ←
        </button>
        <button onClick={reset} style={{ width: "100%", padding: "12px", background: "#FFFFFF", color: "#181433", border: "1.5px solid #ECEAFB", borderRadius: "6px", fontSize: "14px", fontFamily: "'Heebo', sans-serif", cursor: "pointer" }}>למלא שוב מההתחלה</button>
        <p style={{ fontSize: "12px", color: "#9CA3C4", marginTop: "14px", lineHeight: 1.7 }}><strong>הבהרה חשובה:</strong> בשונה מטאב "עמדות", השאלון הזה מבוסס על הערכה מפושטת של Claude למיצוב אידיאולוגי כללי — לא על ציטוטים או מצעים ישירים. שאלות בנושאי ביטחון וזהות משוקללות כפול, ומפלגה שההתאמה הכללית שלה גבוהה אך ההתאמה שלה בנושאי ביטחון וזהות ספציפית נמוכה מ-40% מקבלת סימון — היא לא מוסתרת, רק מסומנת. כלי אוריינטציה בלבד.</p>
      </div>
    );
  }

  return (
    <div>
      <p style={{ fontSize: "13.5px", color: "#3C3860", lineHeight: 1.7, marginBottom: "18px" }}>21 שאלות, 5 תחומים. אפשר לדלג על שאלה.</p>
      {CATEGORY_ORDER.map((cat) => (
        <div key={cat} style={{ marginBottom: "26px" }}>
          <h3 style={{ fontFamily: "'Rubik', sans-serif", fontWeight: 800, fontSize: "16px", margin: "0 0 8px", color: "#181433" }}>{cat}</h3>
          <div style={{ background: "#F0F3FF", border: "1px solid #D6E0FF", borderRadius: "8px", padding: "11px 13px", marginBottom: "12px" }}>
            <p style={{ margin: 0, fontSize: "12.5px", lineHeight: 1.65, color: "#2A2650" }}>{CATEGORY_INTRO[cat]}</p>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
            {QUESTIONS.filter((q) => q.cat === cat).map((q) => (
              <div key={q.id} style={{ background: "#FFFFFF", border: "1px solid #ECEAFB", borderRadius: "6px", padding: "14px 16px" }}>
                <p style={{ margin: "0 0 10px", fontSize: "14.5px", lineHeight: 1.6 }}>{q.text}</p>
                <div style={{ display: "flex", gap: "5px", flexWrap: "wrap" }}>
                  {LIKERT.map((opt) => {
                    const selected = answers[q.id] === opt.v;
                    return <button key={opt.v} onClick={() => setAnswer(q.id, opt.v)} style={{ flex: "1 1 0", minWidth: "58px", padding: "9px 4px", fontSize: "10.5px", lineHeight: 1.3, borderRadius: "8px", border: selected ? "1.5px solid #181433" : "1.5px solid #ECEAFB", background: selected ? "#181433" : "#fff", color: selected ? "#FAFAFF" : "#3C3860", cursor: "pointer", fontFamily: "'Heebo', sans-serif", fontWeight: selected ? 700 : 500 }}>{opt.label}</button>;
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
      <button onClick={() => setShowResults(true)} disabled={answeredCount === 0} style={{ width: "100%", marginTop: "6px", padding: "14px", background: answeredCount ? "#1857C4" : "#ECEAFB", color: "#fff", border: "none", borderRadius: "6px", fontSize: "15px", fontWeight: 700, fontFamily: "'Heebo', sans-serif", cursor: answeredCount ? "pointer" : "not-allowed" }}>הצג תוצאות ({answeredCount}/{QUESTIONS.length} נענו)</button>
    </div>
  );
}

      <main style={{ maxWidth: "760px", margin: "0 auto", padding: "22px 16px 60px", background: "#FFFFFF", borderRadius: "0 0 14px 14px" }}>
        {tab === "compare" && <CompareTab presetParties={presetParties} />}
        {tab === "personal" && <PersonalCompareTab />}
        {tab === "coalition" && <CoalitionBuilderTab />}
        {tab === "polls" && <PollsTab />}
        {tab === "people" && <PeopleTab />}
        {tab === "quiz" && <QuizTab onViewTopMatches={(ids) => { setPresetParties(ids); setTab("compare"); }} />}
        {tab === "kalpi" && <PollingStationTab userLoc={kalpiUserLoc} setUserLoc={setKalpiUserLoc} locStatus={kalpiLocStatus} locErrorMsg={kalpiLocErrorMsg} requestLocation={requestKalpiLocation} />}
        <footer style={{ marginTop: "36px", paddingTop: "18px", borderTop: "1px solid #E3E4F5", fontSize: "12.5px", color: "#6B7280", lineHeight: 1.7 }}>
          <p style={{ margin: "0 0 6px" }}><strong>מתודולוגיה:</strong> כל עמדה בטאב "עמדות" מסונתזת ממספר מקורות — מצע רשמי, ציטוטים מתוארכים מראיונות ונאומים, פוסטים ברשתות חברתיות, הצבעות תקציב בפועל, הסכמים קואליציוניים, וסיקור עיתונאי — ומצוינת ברשימת מקורות מתויגת. עברנו כמה סבבי חיפוש אינטנסיביים שכיסו את רוב הפערים; מה שעדיין ריק (בעיקר בריאות ודיור אצל חלק מהמפלגות, ורוב הנושאים אצל בל"ד) נבדק בפועל ולא נמצא לו מקור אמין ומתוארך — לא דילוג.</p>
          <p style={{ margin: "0 0 6px" }}>סריקת רשתות חברתיות היא חלק קבוע בכל רענון. המידע מתעדכן לפי בקשה בלבד — בקשו "רענון" בשיחה חדשה לקבלת סקרים, ציטוטים ופוסטים עדכניים.</p>
          <p style={{ margin: "0 0 4px" }}>לפניות ושאלות יש לשלוח מייל ל-wsyuval@gmail.com</p>
          <p style={{ margin: 0, fontWeight: 700, color: "#181433" }}>נבנה על ידי יובל וייס</p>
        </footer>
      </main>
    </div>
  );
}


const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<ElectionDashboard />);
</script>
